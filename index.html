<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Screen Share - Mobile & Discord Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Grade Dinâmica de Vídeos (Flexbox) */
        #video-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            width: 100%;
            height: 100%;
            align-content: center;
            justify-content: center;
        }

        /* Cartão de Vídeo - Agora clicável */
        .video-card {
            position: relative;
            background-color: #000;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #374151;
            transition: all 0.3s ease;
            flex: 1 1 300px;
            max-width: 100%;
            height: 300px;
            cursor: zoom-in; /* Cursor indicando expansão */
        }

        .video-card:hover {
            border-color: #4b5563;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Deixa o clique passar para o card */
        }

        .video-label {
            position: absolute;
            bottom: 0.5rem;
            left: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: bold;
            backdrop-filter: blur(4px);
            z-index: 10;
            pointer-events: none;
        }

        /* Botão Tela Cheia (Canto superior direito) */
        .btn-fullscreen {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 0.4rem;
            border-radius: 0.375rem;
            cursor: pointer;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            backdrop-filter: blur(4px);
        }

        .video-card:hover .btn-fullscreen { opacity: 1; }
        .btn-fullscreen:hover { background: rgba(59, 130, 246, 0.8); }

        /* --- MODO FOCO (ESTILO DISCORD) --- */
        #video-grid.has-focus .video-card {
            flex: 0 0 160px; /* Miniaturas embaixo/lado */
            height: 120px;
            order: 2;
            cursor: zoom-in;
        }

        #video-grid.has-focus .video-card.focused {
            flex: 1 1 100%; /* Vídeo principal expandido */
            height: calc(100vh - 180px); /* Ocupa quase tudo */
            order: 1;
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
            cursor: zoom-out; /* Cursor para desfazer foco */
        }

        /* Ajustes Mobile */
        @media (max-width: 768px) {
            .video-card { height: 220px; }
            #video-grid.has-focus .video-card { flex: 0 0 110px; height: 85px; }
            #video-grid.has-focus .video-card.focused { height: 50vh; }
            .btn-fullscreen { opacity: 1; /* Sempre visível no mobile */ }
        }

        /* Fullscreen Nativo */
        :fullscreen .btn-fullscreen-enter { display: none; }
        :fullscreen .btn-fullscreen-exit { display: block; }
        .btn-fullscreen-exit { display: none; }
        :fullscreen .video-card { width: 100vw; height: 100vh; border-radius: 0; border: none; cursor: default; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-screen flex flex-col overflow-hidden selection:bg-blue-500 selection:text-white">

    <!-- Cabeçalho (Sempre Visível) -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 sm:p-4 shrink-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-1.5 sm:p-2 rounded-lg">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-base sm:text-lg font-bold leading-tight flex items-center gap-2">
                        P2P Room
                        <!-- ID da Sala (Só aparece quando conectado) -->
                        <span id="header-room-id" class="hidden text-xs bg-gray-800 border border-gray-700 px-2 py-0.5 rounded font-mono text-blue-400 tracking-wider cursor-pointer hover:bg-gray-700 transition" onclick="copyRoomId()" title="Copiar ID da Sala"></span>
                    </h1>
                </div>
            </div>
            <div id="global-status" class="flex items-center gap-2 text-xs sm:text-sm font-medium text-gray-400 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-500"></span>
                <span id="status-text" class="hidden sm:inline">Aguardando</span>
            </div>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="flex-grow flex flex-col relative overflow-hidden">
        
        <!-- ================= TELA INICIAL ================= -->
        <div id="screen-home" class="absolute inset-0 z-30 bg-gray-950 overflow-y-auto fade-in flex items-center justify-center p-4">
            <div class="max-w-2xl w-full text-center space-y-8 py-8">
                <div class="space-y-4">
                    <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Sala de Reunião</h2>
                    <p class="text-gray-400 text-base sm:text-lg">Crie uma nova sala ou entre em uma sala existente. Funciona no PC e Celular.</p>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-8">
                    <!-- Criar Sala -->
                    <button onclick="createRoom()" class="group relative flex flex-col items-center justify-center p-6 sm:p-8 bg-gray-900 rounded-2xl border-2 border-gray-800 hover:border-blue-500 transition-all hover:shadow-[0_0_30px_rgba(59,130,246,0.2)] text-left hover:-translate-y-1">
                        <div class="bg-blue-500/10 text-blue-500 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold mb-2">Criar Sala Nova</h3>
                        <p class="text-sm text-gray-400 text-center">Inicie uma sala e convide outras pessoas.</p>
                    </button>

                    <!-- Entrar na Sala -->
                    <div class="group relative flex flex-col items-center justify-center p-6 sm:p-8 bg-gray-900 rounded-2xl border-2 border-gray-800 transition-all text-left">
                        <div class="bg-purple-500/10 text-purple-400 p-4 rounded-full mb-4">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold mb-3">Entrar em Sala</h3>
                        <div class="w-full space-y-2">
                            <input type="text" id="join-room-id" class="w-full text-center text-lg tracking-widest font-mono font-bold bg-gray-950 border border-gray-700 rounded-lg p-3 text-purple-400 focus:outline-none focus:border-purple-500 transition placeholder-gray-700 uppercase" placeholder="ABC-123" maxlength="7">
                            <button onclick="joinRoom()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-3 rounded-lg transition">Entrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= TELA DA SALA (VÍDEOS + CONTROLES) ================= -->
        <div id="screen-room" class="hidden absolute inset-0 z-20 flex flex-col bg-gray-950">
            
            <!-- Área Principal: Grade de Vídeos -->
            <div class="flex-grow overflow-y-auto p-4 flex items-center justify-center relative w-full">
                <!-- Mensagem Vazia -->
                <div id="empty-room-msg" class="text-center text-gray-500 absolute pointer-events-none flex flex-col items-center">
                    <svg class="w-16 h-16 text-gray-800 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <p>Sala vazia. Ninguém está transmitindo.</p>
                </div>

                <!-- O Grid Flexbox -->
                <div id="video-grid"></div>
            </div>

            <!-- Barra Inferior de Controles (Estilo Discord) -->
            <div class="shrink-0 h-20 sm:h-24 bg-gray-900 border-t border-gray-800 flex items-center justify-center gap-4 sm:gap-6 px-4 z-40">
                
                <!-- Botão Compartilhar -->
                <button id="btn-open-share-menu" onclick="openShareMenu()" class="flex flex-col items-center gap-1 group">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gray-800 group-hover:bg-blue-600 border border-gray-700 group-hover:border-blue-500 flex items-center justify-center transition-all shadow-lg text-gray-400 group-hover:text-white">
                        <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    </div>
                    <span class="text-[10px] sm:text-xs font-medium text-gray-500 group-hover:text-gray-300">Compartilhar</span>
                </button>

                <!-- Botão Parar Compartilhar (Oculto) -->
                <button id="btn-stop-share" onclick="stopMediaShare()" class="hidden flex flex-col items-center gap-1 group">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center transition-all shadow-lg shadow-red-900/30 text-white">
                        <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </div>
                    <span class="text-[10px] sm:text-xs font-medium text-red-400">Parar</span>
                </button>

                <!-- Botão Estatísticas -->
                <button onclick="toggleStats()" class="flex flex-col items-center gap-1 group">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gray-800 hover:bg-gray-700 border border-gray-700 flex items-center justify-center transition-all shadow-lg text-gray-400 group-hover:text-white">
                        <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    </div>
                    <span class="text-[10px] sm:text-xs font-medium text-gray-500 group-hover:text-gray-300">Status</span>
                </button>

                <!-- Separador -->
                <div class="w-px h-10 bg-gray-800 mx-2"></div>

                <!-- Botão Sair -->
                <button onclick="endSession()" class="flex flex-col items-center gap-1 group">
                    <div class="w-16 h-12 sm:w-20 sm:h-14 rounded-2xl bg-red-600 hover:bg-red-500 flex items-center justify-center transition-all shadow-lg shadow-red-900/20 text-white">
                        <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </div>
                    <span class="text-[10px] sm:text-xs font-medium text-red-400">Sair da Sala</span>
                </button>

            </div>

            <!-- Painel de Estatísticas Flutuante -->
            <div id="stats-panel" class="hidden absolute bottom-24 sm:bottom-28 left-1/2 transform -translate-x-1/2 bg-gray-900/95 backdrop-blur-md rounded-2xl border border-gray-700 shadow-2xl p-5 w-[90%] max-w-sm z-50 fade-in">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-bold text-gray-200">Desempenho da Rede</h3>
                    <button onclick="toggleStats()" class="text-gray-500 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="bg-gray-950 p-3 rounded-xl border border-gray-800">
                        <p class="text-gray-500 mb-1">Na Sala</p>
                        <p id="stat-peers" class="font-bold text-white text-lg">1</p>
                    </div>
                    <div class="bg-gray-950 p-3 rounded-xl border border-gray-800">
                        <p class="text-gray-500 mb-1">RAM Local</p>
                        <p id="stat-memory" class="font-mono text-gray-300 text-lg">N/A</p>
                    </div>
                    <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 col-span-2 flex justify-between items-center">
                        <p class="text-gray-500 flex items-center gap-2"><svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> Enviando</p>
                        <p id="stat-upload" class="font-mono font-bold text-blue-400 text-base">0 kbps</p>
                    </div>
                    <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 col-span-2 flex justify-between items-center">
                        <p class="text-gray-500 flex items-center gap-2"><svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Recebendo</p>
                        <p id="stat-download" class="font-mono font-bold text-purple-400 text-base">0 kbps</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal de Seleção de Mídia (Tela vs Câmera) -->
    <div id="share-menu-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] hidden">
        <div class="bg-gray-900 p-6 rounded-3xl shadow-2xl border border-gray-800 max-w-sm w-full mx-4">
            <h3 class="text-xl font-bold mb-6 text-white text-center">O que compartilhar?</h3>
            
            <div class="space-y-4">
                <button onclick="startMediaShare('screen')" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-blue-500 text-white p-4 rounded-2xl transition text-left flex items-center gap-4 group">
                    <div class="bg-blue-600/20 text-blue-400 p-3 rounded-xl group-hover:bg-blue-500 group-hover:text-white transition"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></div>
                    <div>
                        <p class="font-bold text-base text-gray-200">Tela ou Aba</p>
                        <p class="text-xs text-gray-500">Computador e Android</p>
                    </div>
                </button>
                
                <button onclick="startMediaShare('camera')" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-purple-500 text-white p-4 rounded-2xl transition text-left flex items-center gap-4 group">
                    <div class="bg-purple-600/20 text-purple-400 p-3 rounded-xl group-hover:bg-purple-500 group-hover:text-white transition"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></div>
                    <div>
                        <p class="font-bold text-base text-gray-200">Câmera</p>
                        <p class="text-xs text-gray-500">Rosto e Microfone</p>
                    </div>
                </button>
            </div>

            <button onclick="closeShareMenu()" class="w-full mt-6 text-gray-400 hover:text-white font-medium py-2 rounded-xl transition">Cancelar</button>
        </div>
    </div>

    <!-- Modal de Aviso -->
    <div id="alert-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[110] hidden">
        <div class="bg-gray-900 p-6 rounded-2xl shadow-2xl border border-gray-700 max-w-sm w-full mx-4">
            <h3 id="alert-title" class="text-xl font-bold mb-2 text-white">Aviso</h3>
            <p id="alert-message" class="text-gray-400 mb-6 text-sm"></p>
            <button id="btn-close-alert" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition">Entendi</button>
        </div>
    </div>

    <script>
        // --- ESTADO DA APLICAÇÃO ---
        let myPeer = null; 
        let isRoomHost = false;
        let myRoomId = null;
        let myPeerId = null;
        
        let dataConnections = {}; 
        let myOutgoingCalls = {}; 
        let incomingCalls = {};   
        
        let localStream = null;
        let statsIntervalId = null;
        
        let lastBytesSent = 0;
        let lastBytesReceived = 0;

        const APP_PREFIX = 'P2P-MESH-V3-'; 

        // --- ELEMENTOS DE UI ---
        const screenHome = document.getElementById('screen-home');
        const screenRoom = document.getElementById('screen-room');
        const joinRoomIdInput = document.getElementById('join-room-id');
        const headerRoomId = document.getElementById('header-room-id');
        const videoGrid = document.getElementById('video-grid');
        const emptyRoomMsg = document.getElementById('empty-room-msg');
        
        const btnOpenShareMenu = document.getElementById('btn-open-share-menu');
        const btnStopShare = document.getElementById('btn-stop-share');
        const shareMenuModal = document.getElementById('share-menu-modal');
        const statsPanel = document.getElementById('stats-panel');
        
        const statPeers = document.getElementById('stat-peers');
        const statUpload = document.getElementById('stat-upload');
        const statDownload = document.getElementById('stat-download');
        const statMemory = document.getElementById('stat-memory');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        // Formatação do Input
        joinRoomIdInput.addEventListener('input', function (e) {
            let val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (val.length > 3) val = val.substring(0, 3) + '-' + val.substring(3, 6);
            e.target.value = val;
        });

        // --- UTILIDADES ---
        function generateShortId() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const numbers = '0123456789';
            let l = ''; let n = '';
            for(let i=0; i<3; i++) l += letters.charAt(Math.floor(Math.random() * letters.length));
            for(let i=0; i<3; i++) n += numbers.charAt(Math.floor(Math.random() * numbers.length));
            return `${l}-${n}`;
        }

        function showAlert(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function updateStatusUI(state, text) {
            statusText.innerText = text;
            statusDot.className = 'w-2.5 h-2.5 rounded-full';
            if (state === 'neutral') statusDot.classList.add('bg-gray-500');
            if (state === 'waiting') statusDot.classList.add('bg-yellow-400', 'animate-pulse');
            if (state === 'connected') statusDot.classList.add('bg-green-500');
        }

        function copyRoomId() {
            if(!myRoomId) return;
            navigator.clipboard.writeText(myRoomId).then(() => {
                headerRoomId.classList.replace('text-blue-400', 'text-green-400');
                headerRoomId.classList.add('border-green-500');
                setTimeout(() => { 
                    headerRoomId.classList.replace('text-green-400', 'text-blue-400'); 
                    headerRoomId.classList.remove('border-green-500');
                }, 800);
            }).catch(() => showAlert("Erro", "Copie manualmente."));
        }

        function updateUIOnPeersChange() {
            const count = Object.keys(dataConnections).length + 1;
            statPeers.innerText = count;
        }

        function checkGridEmpty() {
            emptyRoomMsg.style.display = videoGrid.children.length === 0 ? 'flex' : 'none';
        }

        function toggleStats() {
            statsPanel.classList.toggle('hidden');
        }

        // --- MODO FOCO (Clique no Card) ---
        function toggleFocusMode(id) {
            const card = document.getElementById(`video-wrapper-${id}`);
            if (!card) return;

            if (card.classList.contains('focused')) {
                card.classList.remove('focused');
                videoGrid.classList.remove('has-focus');
            } else {
                document.querySelectorAll('.video-card.focused').forEach(c => c.classList.remove('focused'));
                card.classList.add('focused');
                videoGrid.classList.add('has-focus');
                
                // UX Mobile: Rola para o vídeo focado
                setTimeout(() => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            }
        }

        // --- GERENCIAMENTO DE VÍDEO (GRADE) ---
        function addVideoToGrid(id, stream, isLocal = false) {
            removeVideoFromGrid(id); 

            const card = document.createElement('div');
            card.className = "video-card fade-in";
            card.id = `video-wrapper-${id}`;
            card.title = "Clique para expandir/reduzir";

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (isLocal) video.muted = true;

            const label = document.createElement('div');
            label.className = "video-label";
            label.innerText = isLocal ? "Sua Transmissão" : `Usuário ${id.replace(APP_PREFIX, '').substring(0,4)}`;

            // Botão Tela Cheia (Nativo do S.O.)
            const fsBtn = document.createElement('button');
            fsBtn.className = "btn-fullscreen";
            fsBtn.innerHTML = `
                <svg class="w-5 h-5 btn-fullscreen-enter" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                <svg class="w-5 h-5 btn-fullscreen-exit" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 14h4v4m0-4l-5 5m11-5h4v4m0-4l-5 5M4 10h4V6m0 4l-5-5m11 5h4V6m0 4l-5-5"></path></svg>
            `;
            fsBtn.title = "Tela Cheia (Nativo)";

            // Interações
            card.addEventListener('click', (e) => {
                // Se clicou no botão de tela cheia, não dispara o foco
                if(e.target.closest('.btn-fullscreen')) {
                    if (!document.fullscreenElement) {
                        card.requestFullscreen().catch(err => console.error(err));
                    } else {
                        document.exitFullscreen();
                    }
                    return;
                }
                toggleFocusMode(id);
            });

            card.appendChild(video);
            card.appendChild(label);
            card.appendChild(fsBtn);
            videoGrid.appendChild(card);
            
            checkGridEmpty();
        }

        function removeVideoFromGrid(id) {
            const el = document.getElementById(`video-wrapper-${id}`);
            if (el) {
                if(el.classList.contains('focused')) {
                    videoGrid.classList.remove('has-focus');
                }
                el.remove();
            }
            checkGridEmpty();
        }

        // --- SISTEMA PEERJS E MALHA P2P (MESH) ---
        async function startPeerJS(requestedId = null) {
            return new Promise((resolve, reject) => {
                const opts = {
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'turn:openrelay.metered.ca:80', username: "openrelayproject", credential: "openrelayproject" },
                            { urls: 'turn:openrelay.metered.ca:443', username: "openrelayproject", credential: "openrelayproject" }
                        ]
                    }
                };
                
                myPeer = requestedId ? new Peer(requestedId, opts) : new Peer(opts);

                myPeer.on('open', (id) => {
                    myPeerId = id;
                    resolve(id);
                });

                myPeer.on('error', (err) => {
                    if (err.type === 'unavailable-id') reject(new Error("ID da sala já existe. Tente outro."));
                    else reject(err);
                });

                myPeer.on('connection', (conn) => setupDataConnection(conn));

                myPeer.on('call', (call) => {
                    call.answer(); 
                    incomingCalls[call.peer] = call;

                    call.on('stream', (remoteStream) => {
                        addVideoToGrid(call.peer, remoteStream, false);
                    });

                    call.on('close', () => {
                        removeVideoFromGrid(call.peer);
                        delete incomingCalls[call.peer];
                    });
                    
                    call.on('error', () => {
                        removeVideoFromGrid(call.peer);
                        delete incomingCalls[call.peer];
                    });
                });
            });
        }

        function connectToPeer(targetPeerId) {
            if (targetPeerId === myPeerId) return;
            if (dataConnections[targetPeerId]) return;

            const conn = myPeer.connect(targetPeerId);
            setupDataConnection(conn);
        }

        function setupDataConnection(conn) {
            conn.on('open', () => {
                dataConnections[conn.peer] = conn;
                updateUIOnPeersChange();

                if (isRoomHost) {
                    const peerList = Object.keys(dataConnections);
                    conn.send({ type: 'PEER_LIST', peers: peerList });
                }

                if (localStream) {
                    const call = myPeer.call(conn.peer, localStream);
                    myOutgoingCalls[conn.peer] = call;
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'PEER_LIST') {
                    data.peers.forEach(peerId => connectToPeer(peerId));
                }
            });

            conn.on('close', () => {
                delete dataConnections[conn.peer];
                updateUIOnPeersChange();
            });

            conn.on('error', () => {
                delete dataConnections[conn.peer];
                updateUIOnPeersChange();
            });
        }

        // --- AÇÕES DA SALA E MÍDIA ---

        async function createRoom() {
            myRoomId = generateShortId();
            const fullId = APP_PREFIX + myRoomId;
            
            try {
                updateStatusUI('waiting', 'Criando sala...');
                await startPeerJS(fullId);
                
                isRoomHost = true;
                enterRoomUI();
            } catch (e) {
                showAlert("Erro", e.message || "Falha ao criar sala.");
                updateStatusUI('neutral', 'Aguardando Ação');
            }
        }

        async function joinRoom() {
            const rawId = joinRoomIdInput.value.trim();
            if (rawId.length !== 7) {
                showAlert("Aviso", "Digite um ID válido. Ex: ABC-123");
                return;
            }
            myRoomId = rawId;
            const targetHostId = APP_PREFIX + rawId;

            try {
                updateStatusUI('waiting', 'Entrando na sala...');
                await startPeerJS();
                
                isRoomHost = false;
                connectToPeer(targetHostId);
                enterRoomUI();
            } catch (e) {
                showAlert("Erro", "Falha ao acessar a sala.");
                updateStatusUI('neutral', 'Aguardando Ação');
            }
        }

        function enterRoomUI() {
            headerRoomId.innerText = myRoomId;
            headerRoomId.classList.remove('hidden');
            
            screenHome.classList.add('hidden');
            screenRoom.classList.remove('hidden');
            updateStatusUI('connected', 'Conectado');
            
            statsIntervalId = setInterval(calculateStats, 2000);
            checkGridEmpty();
        }

        // --- COMPARTILHAMENTO DE MÍDIA (CORREÇÃO MOBILE) ---
        function openShareMenu() {
            shareMenuModal.classList.remove('hidden');
        }
        function closeShareMenu() {
            shareMenuModal.classList.add('hidden');
        }

        async function startMediaShare(type) {
            // Em navegadores móveis (Safari/Chrome), a chamada do getDisplayMedia 
            // PRECISA vir imediatamente após o clique para não perder o "Gesto do Usuário".
            // Por isso, fechamos o menu DEPOIS de pedir a permissão.
            
            try {
                if (type === 'screen') {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                        throw new Error("Seu navegador não suporta compartilhamento de tela. Use a câmera ou acesse pelo Computador.");
                    }
                    
                    // Fallback para Mobile: Alguns celulares travam se pedir áudio junto com a tela
                    try {
                        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    } catch (e) {
                        if (e.name === 'InvalidAccessError' || e.name === 'NotSupportedError') {
                            // Tenta sem áudio
                            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                        } else {
                            throw e; // Lança o erro de "Cancelado pelo usuário" pra frente
                        }
                    }
                } else if (type === 'camera') {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });
                }

                closeShareMenu(); // Fecha o menu apenas quando obter sucesso na permissão
                
                localStream.getTracks().forEach(track => {
                    track.onended = stopMediaShare; // Encerra se o usuário parar via navegador nativo
                });

                addVideoToGrid('local', localStream, true);

                // Envia a mídia para todos conectados na malha
                Object.keys(dataConnections).forEach(peerId => {
                    const call = myPeer.call(peerId, localStream);
                    myOutgoingCalls[peerId] = call;
                });

                btnOpenShareMenu.classList.add('hidden');
                btnStopShare.classList.remove('hidden');
            } catch (err) {
                closeShareMenu();
                console.error(err);
                if (err.name === "NotAllowedError" || err.name === "NotFoundError") {
                    showAlert("Acesso Cancelado", "Você cancelou a seleção ou negou a permissão.");
                } else {
                    showAlert("Não Suportado", err.message || "A captura falhou ou não é suportada neste aparelho.");
                }
            }
        }

        function stopMediaShare() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            Object.values(myOutgoingCalls).forEach(call => call.close());
            myOutgoingCalls = {};

            removeVideoFromGrid('local');

            btnStopShare.classList.add('hidden');
            btnOpenShareMenu.classList.remove('hidden');
        }

        function endSession() {
            stopMediaShare();
            if (statsIntervalId) clearInterval(statsIntervalId);
            if (myPeer) { myPeer.destroy(); myPeer = null; }

            dataConnections = {};
            incomingCalls = {};
            myOutgoingCalls = {};
            videoGrid.innerHTML = '';
            videoGrid.classList.remove('has-focus');
            
            statUpload.innerText = '0 kbps';
            statDownload.innerText = '0 kbps';
            statPeers.innerText = '1';
            
            headerRoomId.classList.add('hidden');
            screenRoom.classList.add('hidden');
            statsPanel.classList.add('hidden');
            screenHome.classList.remove('hidden');
            updateStatusUI('neutral', 'Aguardando Ação');
        }

        // --- ESTATÍSTICAS ---
        async function calculateStats() {
            let currentBytesSent = 0;
            let currentBytesReceived = 0;

            for (const peerId in myOutgoingCalls) {
                const conn = myOutgoingCalls[peerId];
                if (!conn.peerConnection) continue;
                try {
                    const stats = await conn.peerConnection.getStats();
                    stats.forEach(report => {
                        if (report.type === 'outbound-rtp') currentBytesSent += report.bytesSent || 0;
                    });
                } catch (e) {}
            }

            for (const peerId in incomingCalls) {
                const conn = incomingCalls[peerId];
                if (!conn.peerConnection) continue;
                try {
                    const stats = await conn.peerConnection.getStats();
                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp') currentBytesReceived += report.bytesReceived || 0;
                    });
                } catch (e) {}
            }

            if (lastBytesSent > 0) statUpload.innerText = `${Math.max(0, (currentBytesSent - lastBytesSent) * 8 / 2000).toFixed(0)} kbps`;
            lastBytesSent = currentBytesSent;

            if (lastBytesReceived > 0) statDownload.innerText = `${Math.max(0, (currentBytesReceived - lastBytesReceived) * 8 / 2000).toFixed(0)} kbps`;
            lastBytesReceived = currentBytesReceived;

            if (performance && performance.memory) {
                statMemory.innerText = `${(performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(1)} MB`;
            }
        }

        window.addEventListener('beforeunload', endSession);

    </script>
